useCases:
  - useCase: Template Variables
    slug: TEM
    testCases:
      - id: TEM-010
        priority: Medium
        name: Use PromptDock on mobile without losing access to primary actions
        description: Validates mobile layout behavior at 390x844, including drawer navigation, settings access and dismissal, creating and editing prompts, long-content scrolling, preview and copy actions, and absence of horizontal overflow.
        steps:
          - Use the saved 390 by 844 browser viewport. Do not resize the page with CSS or infer its numeric width from a screenshot. The deployed Account > Layout details panel must be available before executing this candidate.
          - Navigate to the PromptDock site in a fresh browser context
          - Choose to start locally if the onboarding experience appears
          - Open Account > Layout details. Read Browser inner width, Browser inner height, Document client width, Document scroll width and Horizontal overflow. These are live browser measurements in CSS pixels. Verify actual inner width is 390 and inner height is 844, record the document widths and numeric overflow, then close Account by clicking its button again. If the panel or values are unavailable, report the missing measurement; never substitute a screenshot, expected constant or a toast.
          - Open the navigation drawer
          - Open Settings from the drawer
          - Dismiss Settings with the back navigation or Escape key
          - Create a new prompt from mobile with title TS4 Mobile Variable Scroll.
          - |-
            Fill Body with this exact multiline template, then set topic Default value to Launch in Variables definitions:
            Mobile {{topic}}.
            Line 01: scroll 中文 😀.
            Line 02: scroll 中文 😀.
            Line 03: scroll 中文 😀.
