      - id: FLT-009
        priority: High
        name: Use the command palette to search and select a prompt
        description: Validates command palette opening, searching, keyboard navigation, selection, and dismissal.
        steps:
          - Navigate to the app and choose local onboarding if it appears.
          - Open the command palette from the header shortcut.
          - Type a unique prompt name into the palette search.
          - Use the arrow keys to highlight the matching result.
