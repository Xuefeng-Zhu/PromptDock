      - id: FAV-012
        priority: Medium
        name: Import a new prompt and overwrite a disposable duplicate
        description: Validates that importing can add a new prompt, skip unchanged duplicates, and overwrite a disposable modified duplicate without creating extra records.
        steps:
          - Open PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep the complete seeded library; use only disposable TS4 records in this case.
          - Create and save TS4 Fixture Recipe with Body exactly Fixture original {{name}}., Description Disposable test fixture, and tag ts4-fixture. This is the disposable duplicate baseline; do not modify any seeded recipe. Record its complete saved body, description, tags and variable metadata.
          - Open Settings > Import/Export and verify the persistent visible input labelled Choose JSON file is present. Do not select any file yet. For each later import step, use the runner upload operation on this input with only that step’s explicitly named attachment or actual downloaded backup. Do not use the editor From JSON textarea, invent a file path, or substitute another fixture. If this control is absent, report that the new application build is not deployed and stop.
          - Begin capturing the browser download, then click Export prompts to JSON file. Obtain the actual downloaded promptdock-export-YYYY-MM-DD.json file, using its real returned download path. Parse and retain its complete JSON document. A toast, screenshot, filename alone or assumed bytes is not export proof. If the runner cannot capture/read the download, report that capability blocker rather than claiming success.
          - "Inspect the downloaded export and verify the disposable baseline matches the original record in ts4-modified.json by title. Use that actual attached modified file as the deterministic edited import: it changes only the disposable recipe and adds TS4 Imported New. Do not attempt to edit or reconstruct a truncated download."
          - Select the attached Test File ts4-modified.json through Choose JSON file, using its actual available attachment path. Verify its incoming records are the modified TS4 Fixture Recipe and TS4 Imported New, then choose Overwrite duplicates. The disposable recipe must become Body Fixture updated {{name}}., Description Modified disposable fixture, tags ts4-fixture and updated. The one new recipe must have Body New unique fixture body. Do not overwrite any seeded recipe; do not substitute ts4-long.json. If the named attachment is unavailable, report its missing filename and stop.
          - assert: Verify the changed duplicate is overwritten and the new prompt is added without creating an extra record
          - Return to All Prompts, reload the page and inspect the saved disposable records. Verify their full bodies, descriptions, tags and variable metadata match the expected imported versions and each title appears exactly once. Preserve the complete seeded baseline.
          - assert: Verify the overwritten prompt and imported new prompt persist after reload
      - id: FAV-013
        priority: Medium
        name: Reject malformed import JSON and recover with a valid import
        description: Validates that malformed or invalid-schema imports show an error without partial mutations and that a later valid import succeeds.
        steps:
          - Open PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep the complete seeded library; use only disposable TS4 records in this case.
          - Open Settings > Import/Export and verify the persistent visible input labelled Choose JSON file is present. Do not select any file yet. For each later import step, use the runner upload operation on this input with only that step’s explicitly named attachment or actual downloaded backup. Do not use the editor From JSON textarea, invent a file path, or substitute another fixture. If this control is absent, report that the new application build is not deployed and stop.
          - Record the complete saved library baseline. Select actual attached ts4-bad-json.json through Choose JSON file and verify the import error and no persisted changes before proceeding. Then select actual attached ts4-bad-schema.json and verify schema rejection and no persisted changes. Keep both files unchanged; do not approximate malformed data in a different UI. Missing required attachments remain blockers.
          - assert: Verify an import validation error is shown and no partial changes are applied
          - Select actual attached ts4-valid.json through Choose JSON file, using the runner-reported attachment path. This file contains TS4 Fixture Recipe with Body Fixture original {{name}}., Description Disposable test fixture and tag ts4-fixture. Complete the import, choosing Skip duplicates if unchanged records already exist. Verify success and the exact imported values. An unavailable named attachment remains a blocker.
          - Return to All Prompts, reload the page and inspect the saved disposable records. Verify their full bodies, descriptions, tags and variable metadata match the expected imported versions and each title appears exactly once. Preserve the complete seeded baseline.
          - assert: Verify the valid import succeeds and the imported prompt is available
      - id: FAV-014
        priority: Medium
        name: Persist long prompt content and recover from empty searches
        description: Validates that a large multiline prompt with punctuation, Unicode, and emoji saves exactly, survives reload, and can be found again after empty search states in Favorites and Archived recover normally.
        steps:
          - Navigate to PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep all seeded prompts.
          - Open New Prompt and set Title to TS4 Long FAV014. Use the visible Load text file input to upload the ACTUAL attached ts4-exact-12k.txt. Preserve the entire text with quotes, braces, dollar signs, Chinese, emoji and literal {{bad-name!}}. Do not type a sample, regenerate the fixture, use From JSON or copy a truncated preview.
          - Click Text details and read the actual locally computed Text SHA-256 of the complete Body. Compare all 64 hex characters with 23e14e2b4353242e11ada37a7f645db7d74437b015efdf598179cb0ce70cff7a; UTF-8 bytes must be 12288. A mismatch fails; an excerpt, length alone or pasted expected hash does not verify equality.
          - Save the recipe, then perform an actual browser page reload. In All Prompts select TS4 Long FAV014 and open More options > Edit prompt.
          - Click Text details and read the ACTUAL post-reload full Body fingerprint. Verify Text SHA-256 equals 23e14e2b4353242e11ada37a7f645db7d74437b015efdf598179cb0ce70cff7a and UTF-8 bytes equals 12288. This compares the complete restored text against the independently calculated source-file digest. Verify literal {{bad-name!}} remains. Retain this exact-comparison evidence; do not infer it from a toast or excerpt.
          - assert: Verify the long prompt content persists exactly after reload
          - Leave the unchanged saved edit through the Library breadcrumb without Save. In All Prompts record baseline titles/count. Focus the HEADER LIBRARY searchbox using keyboard Tab; do not click an empty searchbox because that opens a separate command palette. Search for Long FAV014 and verify the exact saved prompt is found.
          - Clear that same header searchbox using keyboard Select All and Backspace. Verify its actual value is empty and the entire recorded All Prompts baseline returns.
          - Open Favorites with query empty and observe its normal empty state. Focus the header library searchbox using Tab, enter TS4 unmatched 918274 and verify no matching cards. Clear the SAME searchbox using Select All and Backspace, verify query empty and normal empty Favorites state returns.
          - Open Archived with query empty. Enter TS4 unmatched 918274 into the header library searchbox, verify no matches, then clear the same searchbox with Select All and Backspace. Verify query empty and normal empty Archived state returns.
          - Explicitly select All Prompts with query empty and no folder/tag filters. Verify all recorded baseline titles/count and TS4 Long FAV014 return.
          - assert: Verify search finds the prompt and empty search states are recoverable in the Favorites and Archived views
