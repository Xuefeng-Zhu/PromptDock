# FIVE-CASE PATCH ONLY; not a complete portal-plan replacement.
# Pending production deployment of Text details. All original assertions remain.
---
requiresDeployment: true
baseSavedPlanSha256: e62799e1d3701bae5f7cd692b1c790b889b3c335510116edf06e65a4b88c1ad6
testCases:
- id: ONB-009
  priority: Medium
  name: Handle long prompt content, search empty states, and favorites or archive recovery
  description: >-
    Verifies long multiline content round-trips exactly, unsupported placeholder names remain literal, and empty-state recovery
    for search, favorites, and archived views.
  steps:
  - >-
    Navigate to PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep all seeded
    recipes; this case uses only one disposable recipe.
  - Open New Prompt once and set Title to TS4 Long ONB009.
  - >-
    Use the visible Load text file input to upload the actual attached ts4-exact-12k.txt. Preserve its complete UTF-8 text,
    including literal {{bad-name!}}. Do not use From JSON, copy a truncated preview, type a sample or regenerate the fixture.
  - >-
    Click Text details in the editor. Wait for the locally computed Text SHA-256 and UTF-8 bytes outputs. Read the actual
    full 64-character digest and compare with 23e14e2b4353242e11ada37a7f645db7d74437b015efdf598179cb0ce70cff7a; bytes must
    be 12288. This is a fingerprint of ALL current text, independently compared with the source-file digest, not a screenshot/length/toast
    comparison. Treat any different digest as failure, not a pass. If Text details is absent, report the undeployed-build
    blocker. Keep the Body unchanged.
  - Save the recipe.
  - >-
    Reload the actual browser page. This must restore the saved recipe from persistence; navigating to Library alone does
    not perform a reload.
  - >-
    In All Prompts select TS4 Long ONB009, open More options > Edit prompt, and click Text details. Read the ACTUAL computed
    full Text SHA-256 after reload. Compare all 64 hex characters with 23e14e2b4353242e11ada37a7f645db7d74437b015efdf598179cb0ce70cff7a;
    UTF-8 bytes must be 12288. This verifies the complete restored Body against the independently calculated expected source
    digest. Also verify the literal unsupported {{bad-name!}} text remains present. A copied expected constant, visible excerpt
    or approximate character count cannot satisfy this comparison. Retain this exact-comparison evidence for the assertion
    below. To cancel this unchanged saved edit, use the Library breadcrumb; the saved Edit Prompt screen has no separate Cancel
    button. Do not click Save.
  - >-
    Leave the unchanged editor through the Library breadcrumb without saving (cancel the edit). Return to All Prompts and
    record the complete baseline titles/count including the long recipe.
  - >-
    Focus the HEADER LIBRARY searchbox with keyboard Tab. Enter TS4 unmatched 918274 into that same searchbox, verify its
    actual query and the No prompts found library state. Do not click an empty header searchbox or operate the independent
    command palette.
  - >-
    Clear the SAME header library searchbox using actual keyboard Select All and Backspace/Delete. Verify its value is empty
    and the complete baseline library returns.
  - Open Favorites in sidebar navigation and verify the empty Favorites state with the header query still empty.
  - Open Archived in sidebar navigation and verify the empty Archived state with the header query still empty.
  - >-
    Explicitly select All Prompts with header query empty and no tag/folder filters. Verify every recorded baseline title/count
    and the saved long recipe return. Retain the full computed post-reload fingerprint comparison evidence above.
  - assert: >-
      Compare the entire saved Body after reload with the attached ts4-exact-12k.txt exactly, including unsupported {{bad-name!}}
      remaining literal. Verify all empty search, Favorites and Archived states can be exited back to the full baseline library
      and saved recipe. An excerpt or toast is insufficient.
