          - assert: Verify the previously inspected preview and complete pasted Body are exactly Use Ada and literal., with safe single-pass substitution. Cancel the disposable draft without saving.
      - id: LIB-012
        priority: High
        name: Export active prompts and import them back safely
        description: Validate active prompts can be exported and reimported, duplicates are skipped, and valid imports recover after invalid JSON or schema attempts.
        steps:
          - Open PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep the complete seeded library; use only disposable TS4 records in this case.
          - Create and save TS4 Fixture Recipe with Body exactly Fixture original {{name}}., Description Disposable test fixture, and tag ts4-fixture. This is the disposable duplicate baseline; do not modify any seeded recipe. Record its complete saved body, description, tags and variable metadata.
          - Create and save a separate active recipe titled TS4 Export Metadata with Body exactly Write {{topic}} in {{tone}}., Description Exact export metadata, and tag ts4-export. In Variables definitions set topic to Textarea with saved Default value Launch newline Campaign (a real newline), and tone to Dropdown with options Friendly, Professional and saved Default value Friendly. Verify the saved controls before continuing.
          - Create and save a disposable plain recipe titled TS4 Archived File Check with Body exactly Archived export exclusion. Archive this recipe through its prompt actions. Verify it appears in Archived and is excluded from All Prompts before opening Settings.
          - Open Settings > Import/Export and verify the persistent visible input labelled Choose JSON file is present. Do not select any file yet. For each later import step, use the runner upload operation on this input with only that step’s explicitly named attachment or actual downloaded backup. Do not use the editor From JSON textarea, invent a file path, or substitute another fixture. If this control is absent, report that the new application build is not deployed and stop.
          - Begin capturing the browser download, then click Export prompts to JSON file. Obtain the actual downloaded promptdock-export-YYYY-MM-DD.json file, using its real returned download path. Parse and retain its complete JSON document. A toast, screenshot, filename alone or assumed bytes is not export proof. If the runner cannot capture/read the download, report that capability blocker rather than claiming success.
          - "Inspect the actual downloaded JSON: version must be 1.0, exportedAt must be present, and prompts must contain every active baseline record with exact body, description, tags and variable metadata. Verify TS4 Archived File Check is absent, and record the full active prompt count/content before importing."
          - Select the actual exported JSON download in the persistent Choose JSON file input. Choose Skip duplicates. Select that SAME unmodified downloaded file again and choose Skip duplicates again. Verify no active recipe, body, tag or variable metadata changed and no duplicate copies were created after either import. Keep using actual downloaded bytes, not a reconstructed JSON string.
          - Select the attached Test File ts4-modified.json through Choose JSON file, using its actual available attachment path. Verify its incoming records are the modified TS4 Fixture Recipe and TS4 Imported New, then choose Overwrite duplicates. The disposable recipe must become Body Fixture updated {{name}}., Description Modified disposable fixture, tags ts4-fixture and updated. The one new recipe must have Body New unique fixture body. Do not overwrite any seeded recipe; do not substitute ts4-long.json. If the named attachment is unavailable, report its missing filename and stop.
          - Return to All Prompts, reload the page and inspect the saved disposable records. Verify their full bodies, descriptions, tags and variable metadata match the expected imported versions and each title appears exactly once. Preserve the complete seeded baseline.
          - Open Settings > Import/Export and verify the persistent visible input labelled Choose JSON file is present. Do not select any file yet. For each later import step, use the runner upload operation on this input with only that step’s explicitly named attachment or actual downloaded backup. Do not use the editor From JSON textarea, invent a file path, or substitute another fixture. If this control is absent, report that the new application build is not deployed and stop.
          - Record the complete saved library baseline. Select actual attached ts4-bad-json.json through Choose JSON file and verify the import error and no persisted changes before proceeding. Then select actual attached ts4-bad-schema.json and verify schema rejection and no persisted changes. Keep both files unchanged; do not approximate malformed data in a different UI. Missing required attachments remain blockers.
          - Select actual attached ts4-valid.json through Choose JSON file, using the runner-reported attachment path. This file contains TS4 Fixture Recipe with Body Fixture original {{name}}., Description Disposable test fixture and tag ts4-fixture. Complete the import, choosing Skip duplicates if unchanged records already exist. Verify success and the exact imported values. An unavailable named attachment remains a blocker.
          - Return to All Prompts, reload the page and inspect the saved disposable records. Verify their full bodies, descriptions, tags and variable metadata match the expected imported versions and each title appears exactly once. Preserve the complete seeded baseline.
          - assert: Verify active prompts are exported without archived prompts and reimported prompts persist after reload
          - assert: Verify duplicates are skipped or overwritten as intended, invalid imports do not create partial records, and valid import recovery succeeds
      - id: LIB-013
        priority: Medium
        name: Render a large prompt and preserve search and empty states
        description: Validate the app can store and restore a long prompt containing multiline text, quotes, braces, dollar signs, and Unicode, while empty search and empty library states recover correctly.
        steps:
          - Navigate to PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep all seeded recipes; this case uses only one disposable recipe.
          - Open New Prompt once and set Title to TS4 Long LIB013.
          - Use the visible Load text file input to upload the actual attached ts4-exact-12k.txt. Preserve its complete UTF-8 text, including literal {{bad-name!}}. Do not use From JSON, copy a truncated preview, type a sample or regenerate the fixture.
          - Click Text details in the editor. Wait for the locally computed Text SHA-256 and UTF-8 bytes outputs. Read the actual full 64-character digest and compare with 23e14e2b4353242e11ada37a7f645db7d74437b015efdf598179cb0ce70cff7a; bytes must be 12288. This is a fingerprint of ALL current text, independently compared with the source-file digest, not a screenshot/length/toast comparison. Treat any different digest as failure, not a pass. If Text details is absent, report the undeployed-build blocker. Keep the Body unchanged.
          - Save the recipe.
          - Reload the actual browser page. This must restore the saved recipe from persistence; navigating to Library alone does not perform a reload.
          - In All Prompts select TS4 Long LIB013, open More options > Edit prompt, and click Text details. Read the ACTUAL computed full Text SHA-256 after reload. Compare all 64 hex characters with 23e14e2b4353242e11ada37a7f645db7d74437b015efdf598179cb0ce70cff7a; UTF-8 bytes must be 12288. This verifies the complete restored Body against the independently calculated expected source digest. Also verify the literal unsupported {{bad-name!}} text remains present. A copied expected constant, visible excerpt or approximate character count cannot satisfy this comparison. Retain this exact-comparison evidence for the assertion below. To cancel this unchanged saved edit, use the Library breadcrumb; the saved Edit Prompt screen has no separate Cancel button. Do not click Save.
          - assert: Open Edit on TS4 Long LIB013 after reload and compare its entire saved Body with the attached ts4-exact-12k.txt source exactly. Preserve all symbols and unsupported {{bad-name!}} literally. Cancel Edit without changes. A screenshot or approximate length is insufficient.
          - Leave the unchanged editor through the Library breadcrumb without saving (cancel the edit). Return to All Prompts and record the complete baseline titles/count including the long recipe.
          - Focus the HEADER LIBRARY searchbox with keyboard Tab. Enter TS4 unmatched 918274 into that same searchbox, verify its actual query and the No prompts found library state. Do not click an empty header searchbox or operate the independent command palette.
          - Clear the SAME header library searchbox using actual keyboard Select All and Backspace/Delete. Verify its value is empty and the complete baseline library returns.
          - Open Favorites in sidebar navigation and verify the empty Favorites state with the header query still empty.
          - Open Archived in sidebar navigation and verify the empty Archived state with the header query still empty.
          - Explicitly select All Prompts with header query empty and no tag/folder filters. Verify every recorded baseline title/count and the saved long recipe return. Retain the full computed post-reload fingerprint comparison evidence above.
