  - useCase: Search and Empty States
    slug: SEA
    testCases:
      - id: SEA-001
        priority: High
        name: Recover from empty search results
        description: Validates that searching filters prompts and the empty state can be cleared to restore results.
        steps:
          - Navigate to PromptDock and start locally if onboarding appears. Select All Prompts and record the baseline visible prompt titles and count.
          - Use keyboard Tab to focus the header LIBRARY searchbox without clicking the empty field (an empty-field click opens Command palette). Type TS4 no match 918274. Verify this header value; if a palette is open dismiss it first and focus the header by keyboard.
          - assert: Verify the library header query is TS4 no match 918274, All Prompts is selected, and No prompts found is displayed for the library results.
          - Clear the SAME header library searchbox using select-all and Backspace/Delete. Verify its value is empty and no independent Command palette dialog is hiding a different query.
          - assert: Verify All Prompts restores the full baseline prompt titles and count after clearing that same library query.
      - id: SEA-002
        priority: High
        name: Open the search palette and dismiss it
        description: Validates that the keyboard shortcut opens the command palette, supports no-results search, and closes with Escape.
        steps:
          - Navigate to the PromptDock app and start locally if the onboarding screen appears.
          - Press Cmd/Ctrl+K to open the command palette.
          - Enter a search term that does not match any command or prompt.
          - assert: Verify an empty state is shown in the palette search results.
          - Press Escape.
          - assert: Verify the command palette is closed.
      - id: SEA-003
        priority: High
        name: Select a search result from the command palette
        description: Validates that palette search results can be navigated with arrows and chosen with Enter.
        steps:
          - Navigate to the PromptDock app in a fresh anonymous context and start locally if onboarding appears.
          - Open New Prompt. Set Title to TS4 Arrow Choice Alpha and Body to exactly Alpha {{topic}}.
          - In Variables definitions fill Default value for topic with Launch. This must be the saved default, not the transient Live Preview input. Verify it displays Launch before continuing.
          - Click Save to save Alpha.
          - Open New Prompt. Set Title to TS4 Arrow Choice Beta and Body to exactly Beta {{topic}}.
          - In THIS Beta editor fill Default value for topic with Launch. Verify Beta default displays Launch and the preview shows Beta Launch. before saving. The Alpha default does not carry over to Beta.
          - Click Save to save Beta.
          - Open the command palette with Ctrl+K (Cmd+K on macOS), focus its search field and search exactly TS4 Arrow Choice. Verify BOTH Alpha and Beta appear.
          - With focus in the palette search field press ArrowUp twice to highlight the first result. Record that result title.
          - Press ArrowDown exactly once. Verify the highlighted result changes to the other title; record the new title. Do not click a result.
          - Press Enter with search still focused. Verify Fill Variables opens for the title highlighted AFTER ArrowDown, different from the previous title. Verify topic is Launch and its exact corresponding preview is Alpha Launch. or Beta Launch.
          - assert: Verify the selected result is opened or applied.
      - id: SEA-004
        priority: High
        name: Search prompts by title, description, and tag
        description: Validates that text search finds matching prompts across prompt content and tags, with matching results shown in the list.
        steps:
          - Navigate to the PromptDock app and start locally if the onboarding screen appears.
          - Enter a search term that matches a prompt title, description, or tag.
          - assert: Verify only matching prompts are shown in the results.
      - id: SEA-005
        priority: Medium
        name: Recover from empty Favorites and Archived views
        description: Validates that empty library views show a recoverable empty state and that results return after restoring matching items.
        steps:
          - Navigate to the PromptDock app and start locally if the onboarding screen appears.
          - Open the Favorites view.
          - assert: Verify an empty state is shown when no favorites are available.
          - Open the Archived view.
          - assert: Verify an empty state is shown when no archived prompts are available.
