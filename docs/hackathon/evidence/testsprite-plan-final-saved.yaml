        name: Handle large prompt content, search empty states, and favorites archive recovery
        description: Validates exact persistence of a large multiline prompt containing quotes, braces, dollar signs, Unicode, and emoji, plus empty search behavior and empty-state recovery in Favorites and Archived views.
