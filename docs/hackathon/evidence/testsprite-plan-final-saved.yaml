      - id: FLT-011
        priority: High
        name: Create a prompt with the default template variables and persist metadata
        description: Validates the template prompt editor behavior with default variable values, one topic input, live preview, and reload persistence.
        steps:
          - Navigate to the app and choose local onboarding if it appears.
          - "Open New Prompt and create TS4 Topic Tone Metadata with description Saved variable metadata and body exactly Write {{topic}} in {{tone}}. Repeat: {{topic}}. Configure topic as Textarea with Default value Launch. Configure tone as Dropdown with options Friendly, Professional, Concise and Default value Friendly. This fixture is created in this case, not assumed to exist."
          - Verify the topic field defaults to Launch and the tone selection defaults to Friendly.
          - "In Variables definitions change topic Default value to exactly two lines: Launch then Campaign. Verify the textarea value and live preview preserve the real newline. Set the SAVED default, not only the transient Live Preview value."
          - In Variables definitions set tone Default value to Professional, leaving Dropdown options Friendly, Professional, Concise. Verify the live preview uses Professional.
          - Save the prompt.
          - Reload the page.
          - Open the saved prompt again.
          - "Select TS4 Topic Tone Metadata and open More options > Edit prompt. Verify saved Title and Description; topic is Textarea with default exactly Launch newline Campaign; tone is Dropdown with options Friendly, Professional, Concise and default Professional. In Live Preview verify exactly ONE topic value control despite two tokens and exact rendered text Write Launch newline Campaign in Professional. Repeat: Launch newline Campaign."
          - "Verify Body is exactly Write {{topic}} in {{tone}}. Repeat: {{topic}}. without rendered substitution. To cancel this UNCHANGED saved edit, activate the Library breadcrumb without clicking Save. The saved Edit Prompt screen has no separate Cancel button; Library is its leave-editor control. In this assertion Cancel means leave the unchanged edit without saving. Return to All Prompts, reload, reopen the same saved prompt and verify the unresolved Body and both saved defaults are still exact. Leave via Library again without saving; ensure no extra prompt was created."
          - assert: "Verify the saved title, description, variable metadata and live preview persist after reload, including a SINGLE topic input despite its repeated token. Topic default must be Launch newline Campaign and tone default Professional; preview must exactly be Write Launch newline Campaign in Professional. Repeat: Launch newline Campaign. Open Edit and verify the unresolved body remains Write {{topic}} in {{tone}}. Repeat: {{topic}}., then Cancel without changes."
      - id: FLT-012
        priority: High
        name: Copy the rendered template output with required values present
        description: Validates that the template copy action produces the exact rendered output when required values are filled and that the clipboard matches the preview text.
        steps:
          - Navigate to the app in a fresh anonymous context and choose local onboarding if it appears.
          - "Open New Prompt. Create TS4 Topic Tone Copy with body exactly Write {{topic}} in {{tone}}. Repeat: {{topic}}. Configure topic default Launch and tone as Dropdown with options Friendly, Professional, Concise and default Friendly."
          - Save, reload, and select TS4 Topic Tone Copy. Open the command palette with Ctrl+K (Cmd+K on macOS), search this exact title, and select the result to open Fill Variables.
          - "In Fill Variables set topic to exactly Product launch and tone to Professional. Read and remember the preview, which must be exactly Write Product launch in Professional. Repeat: Product launch."
          - Click Copy to Clipboard inside Fill Variables. If the modal remains open, close it. Open New Prompt, click its Body textarea to focus it, then press Ctrl+V (Cmd+V on macOS). Do not type the expected string; this draft must receive the real clipboard contents.
          - assert: Verify the clipboard contains the exact rendered output for the current topic and tone values.
          - assert: Verify the live preview matches the copied output exactly.
          - "Verify the pasted draft body is exactly Write Product launch in Professional. Repeat: Product launch. A toast alone is insufficient. Click the editor Cancel button without saving and verify TS4 Topic Tone Copy remains the only saved fixture."
      - id: FLT-013
        priority: High
        name: Render literal special characters and braces in the template prompt
        description: Validates that special characters, Unicode, emoji, and placeholder-like text are rendered literally without HTML interpretation or recursive replacement.
        steps:
          - Navigate to the app and choose local onboarding if it appears.
          - "Create a new prompt named TS4 Folder Literal with body exactly Write {{topic}} in {{tone}}. Repeat: {{topic}}. Create this fixture within this fresh test context; it is not seeded."
          - In Variables definitions set topic Default value to exactly $& <tag> 中文 😀 {{tone}}. Preserve the literal punctuation and braces.
          - In Variables definitions configure tone as Dropdown with options Friendly, Professional, Concise and Default value Professional.
          - "Verify the editor preview is exactly Write $& <tag> 中文 😀 {{tone}} in Professional. Repeat: $& <tag> 中文 😀 {{tone}}. Save the prompt."
          - Reload the page.
          - "Open TS4 Folder Literal after reload and verify its inspector displays exactly Write $& <tag> 中文 😀 {{tone}} in Professional. Repeat: $& <tag> 中文 😀 {{tone}}. Open it using Ctrl+K (Cmd+K on macOS) and select its search result to enter Fill Variables. Verify topic default and Professional dropdown selection persisted, and the modal preview matches exactly."
          - Click Copy to Clipboard in Fill Variables, then open a new prompt draft and paste using Ctrl+V (Cmd+V on macOS) into its body to inspect the actual clipboard content.
          - assert: "Verify the pasted body is exactly Write $& <tag> 中文 😀 {{tone}} in Professional. Repeat: $& <tag> 中文 😀 {{tone}}. The literal $&, angle brackets, Chinese, emoji and {{tone}} must be preserved without HTML interpretation or recursive replacement. A toast alone does not prove clipboard equality. Cancel the verification draft without saving."
      - id: FLT-014
        priority: High
        name: Use constructor and proto placeholders safely and persist custom values
        description: Validates that the regression prompt keeps placeholders intact by default, allows custom values, and renders the exact expected output after reload.
        steps:
          - Navigate to the app and choose local onboarding if it appears.
          - Create within this case a recipe titled TS4 Safe Defaults FLT014 with body exactly Use {{constructor}} and {{__proto__}}. Leave both defaults empty, Save, then open Cmd/Ctrl+K and select this recipe to open Fill Variables.
          - In Fill Variables verify both inputs are initially empty and the rendered preview still shows exactly Use {{constructor}} and {{__proto__}}.
          - In Fill Variables verify Copy to Clipboard is disabled while either required input is missing.
          - Fill the constructor field with Ada.
          - Fill the __proto__ field with literal.
          - Verify modal preview Use Ada and literal., then Cancel the modal. Open Edit for this saved recipe and set saved constructor Default value Ada and __proto__ Default value literal in Variables definitions, then Save.
          - Reload the page.
          - After reload verify the saved recipe body is still unresolved. Open Cmd/Ctrl+K and select TS4 Safe Defaults FLT014; verify the persisted defaults populate Ada and literal in Fill Variables.
          - Verify exact preview Use Ada and literal., click Copy to Clipboard, open a disposable New Prompt draft and paste into Body with Cmd/Ctrl+V.
          - assert: Verify the persisted defaults, rendered preview and full pasted Body are exactly Use Ada and literal., with no crash or TypeError. Cancel the verification draft without saving.
      - id: FLT-015
        priority: High
        name: Export active prompts and reimport valid JSON without duplicating existing records
        description: Validates that active prompts can be exported as JSON, reimported, and deduplicated without creating extra records.
        steps:
          - Open PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep the complete seeded library; use only disposable TS4 records in this case.
          - Create and save a separate active recipe titled TS4 Export Metadata with Body exactly Write {{topic}} in {{tone}}., Description Exact export metadata, and tag ts4-export. In Variables definitions set topic to Textarea with saved Default value Launch newline Campaign (a real newline), and tone to Dropdown with options Friendly, Professional and saved Default value Friendly. Verify the saved controls before continuing.
          - Create and save a disposable plain recipe titled TS4 Archived File Check with Body exactly Archived export exclusion. Archive this recipe through its prompt actions. Verify it appears in Archived and is excluded from All Prompts before opening Settings.
          - Open Settings > Import/Export and verify the persistent visible input labelled Choose JSON file is present. Do not select any file yet. For each later import step, use the runner upload operation on this input with only that step’s explicitly named attachment or actual downloaded backup. Do not use the editor From JSON textarea, invent a file path, or substitute another fixture. If this control is absent, report that the new application build is not deployed and stop.
          - Begin capturing the browser download, then click Export prompts to JSON file. Obtain the actual downloaded promptdock-export-YYYY-MM-DD.json file, using its real returned download path. Parse and retain its complete JSON document. A toast, screenshot, filename alone or assumed bytes is not export proof. If the runner cannot capture/read the download, report that capability blocker rather than claiming success.
          - "Inspect the actual downloaded JSON: version must be 1.0, exportedAt must be present, and prompts must contain every active baseline record with exact body, description, tags and variable metadata. Verify TS4 Archived File Check is absent, and record the full active prompt count/content before importing."
          - Select the actual exported JSON download in the persistent Choose JSON file input. Choose Skip duplicates. Select that SAME unmodified downloaded file again and choose Skip duplicates again. Verify no active recipe, body, tag or variable metadata changed and no duplicate copies were created after either import. Keep using actual downloaded bytes, not a reconstructed JSON string.
          - Return to All Prompts, reload the page and inspect the saved disposable records. Verify their full bodies, descriptions, tags and variable metadata match the expected imported versions and each title appears exactly once. Preserve the complete seeded baseline.
          - assert: Verify the active prompts remain unchanged and no duplicate records are added.
      - id: FLT-016
        priority: Medium
        name: Import a modified duplicate and a new prompt from JSON
        description: Validates that an imported duplicate can be overwritten for a disposable local record and that a new record is added successfully.
        steps:
          - Open PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep the complete seeded library; use only disposable TS4 records in this case.
          - Create and save TS4 Fixture Recipe with Body exactly Fixture original {{name}}., Description Disposable test fixture, and tag ts4-fixture. This is the disposable duplicate baseline; do not modify any seeded recipe. Record its complete saved body, description, tags and variable metadata.
          - Open Settings > Import/Export and verify the persistent visible input labelled Choose JSON file is present. Do not select any file yet. For each later import step, use the runner upload operation on this input with only that step’s explicitly named attachment or actual downloaded backup. Do not use the editor From JSON textarea, invent a file path, or substitute another fixture. If this control is absent, report that the new application build is not deployed and stop.
          - Select the attached Test File ts4-modified.json through Choose JSON file, using its actual available attachment path. Verify its incoming records are the modified TS4 Fixture Recipe and TS4 Imported New, then choose Overwrite duplicates. The disposable recipe must become Body Fixture updated {{name}}., Description Modified disposable fixture, tags ts4-fixture and updated. The one new recipe must have Body New unique fixture body. Do not overwrite any seeded recipe; do not substitute ts4-long.json. If the named attachment is unavailable, report its missing filename and stop.
          - Return to All Prompts, reload the page and inspect the saved disposable records. Verify their full bodies, descriptions, tags and variable metadata match the expected imported versions and each title appears exactly once. Preserve the complete seeded baseline.
          - assert: Verify the modified disposable prompt is updated and the new prompt is added as a separate record after reload.
      - id: FLT-017
        priority: Medium
        name: Reject malformed or invalid-schema JSON import and recover with a valid import
        description: Validates that invalid JSON import inputs are rejected without partial mutations and that a subsequent valid import still succeeds.
        steps:
          - Open PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep the complete seeded library; use only disposable TS4 records in this case.
          - Open Settings > Import/Export and verify the persistent visible input labelled Choose JSON file is present. Do not select any file yet. For each later import step, use the runner upload operation on this input with only that step’s explicitly named attachment or actual downloaded backup. Do not use the editor From JSON textarea, invent a file path, or substitute another fixture. If this control is absent, report that the new application build is not deployed and stop.
          - Record the complete saved library baseline. Select actual attached ts4-bad-json.json through Choose JSON file and verify the import error and no persisted changes before proceeding. Then select actual attached ts4-bad-schema.json and verify schema rejection and no persisted changes. Keep both files unchanged; do not approximate malformed data in a different UI. Missing required attachments remain blockers.
          - assert: Verify an import validation error is shown and no partial changes are applied.
          - Select actual attached ts4-valid.json through Choose JSON file, using the runner-reported attachment path. This file contains TS4 Fixture Recipe with Body Fixture original {{name}}., Description Disposable test fixture and tag ts4-fixture. Complete the import, choosing Skip duplicates if unchanged records already exist. Verify success and the exact imported values. An unavailable named attachment remains a blocker.
          - Return to All Prompts, reload the page and inspect the saved disposable records. Verify their full bodies, descriptions, tags and variable metadata match the expected imported versions and each title appears exactly once. Preserve the complete seeded baseline.
          - assert: Verify the valid import succeeds after the earlier invalid attempts.
      - id: FLT-018
        priority: Medium
        name: Handle a long prompt with exact persistence and literal unsupported placeholder punctuation
        description: Validates that a very long prompt with multiline content, quotes, braces, dollar signs, Unicode, and unsupported placeholder punctuation reloads exactly and survives search and empty-state recovery flows.
        steps:
          - Navigate to PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep all seeded recipes; this case uses only one disposable recipe.
          - Open New Prompt once and set Title to TS4 Long FLT018.
          - Use the visible Load text file input to upload the actual attached ts4-exact-12k.txt. Preserve its complete UTF-8 text, including literal {{bad-name!}}. Do not use From JSON, copy a truncated preview, type a sample or regenerate the fixture.
          - Click Text details in the editor. Wait for the locally computed Text SHA-256 and UTF-8 bytes outputs. Read the actual full 64-character digest and compare with 23e14e2b4353242e11ada37a7f645db7d74437b015efdf598179cb0ce70cff7a; bytes must be 12288. This is a fingerprint of ALL current text, independently compared with the source-file digest, not a screenshot/length/toast comparison. Treat any different digest as failure, not a pass. If Text details is absent, report the undeployed-build blocker. Keep the Body unchanged.
          - Save the recipe.
          - Reload the actual browser page. This must restore the saved recipe from persistence; navigating to Library alone does not perform a reload.
          - In All Prompts select TS4 Long FLT018, open More options > Edit prompt, and click Text details. Read the ACTUAL computed full Text SHA-256 after reload. Compare all 64 hex characters with 23e14e2b4353242e11ada37a7f645db7d74437b015efdf598179cb0ce70cff7a; UTF-8 bytes must be 12288. This verifies the complete restored Body against the independently calculated expected source digest. Also verify the literal unsupported {{bad-name!}} text remains present. A copied expected constant, visible excerpt or approximate character count cannot satisfy this comparison. Retain this exact-comparison evidence for the assertion below. To cancel this unchanged saved edit, use the Library breadcrumb; the saved Edit Prompt screen has no separate Cancel button. Do not click Save.
          - assert: Open Edit after reload and compare the full Body exactly with the attached ts4-exact-12k.txt, including real newlines and all literal {{bad-name!}} punctuation. Verify the original source has 12,288 UTF-8 bytes as recorded in manifest.json; do not confuse bytes with JavaScript character count. Cancel Edit without changes.
          - Leave the unchanged editor through the Library breadcrumb without saving (cancel the edit). Return to All Prompts and record the complete baseline titles/count including the long recipe.
          - Focus the HEADER LIBRARY searchbox with keyboard Tab. Enter TS4 unmatched 918274 into that same searchbox, verify its actual query and the No prompts found library state. Do not click an empty header searchbox or operate the independent command palette.
          - assert: Verify the empty search state is shown.
          - Clear the SAME header library searchbox using actual keyboard Select All and Backspace/Delete. Verify its value is empty and the complete baseline library returns.
          - Open Favorites in sidebar navigation and verify the empty Favorites state with the header query still empty.
          - Open Archived in sidebar navigation and verify the empty Archived state with the header query still empty.
          - assert: Verify the empty state is shown in Favorites and Archived when no matching items are present.
          - Explicitly select All Prompts with header query empty and no tag/folder filters. Verify every recorded baseline title/count and the saved long recipe return. Retain the full computed post-reload fingerprint comparison evidence above.
          - assert: Verify the prompt list is restored.
      - id: FLT-019
        priority: Medium
        name: Use the app on mobile with drawer, settings navigation, and scrolling
        description: Validates that the app works at mobile viewport size with drawer navigation, settings return flow, long-content scrolling, and accessible primary actions.
        steps:
          - Open the app in a fresh browser context at a mobile viewport and verify the viewport width matches the expected mobile size.
          - Choose local onboarding if it appears.
          - Open the navigation drawer.
          - Navigate to Settings from the drawer.
          - Return from Settings using the back navigation or Escape key.
          - Create and Save TS4 Mobile Variable Scroll with body consisting of long multiline scrolling content followed by Use {{topic}}. Configure topic as Textarea with saved default Mobile. This case must create its own variable recipe so a Fill Variables path exists.
          - Scroll through the editor and preview area.
          - Open Cmd/Ctrl+K and select TS4 Mobile Variable Scroll to open Fill Variables; a separate inspector Fill button is not part of the app. Fill topic Mobile filled, verify live substitution, then click Copy to Clipboard. Keep long-content scrolling and numeric viewport checks.
          - assert: Verify the mobile layout remains usable, primary actions stay accessible, and there is no horizontal overflow.
