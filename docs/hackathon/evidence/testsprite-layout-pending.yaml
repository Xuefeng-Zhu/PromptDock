            Line 21: scroll 中文 😀.
            Line 22: scroll 中文 😀.
            Line 23: scroll 中文 😀.
            Line 24: scroll 中文 😀.
          - Save the prompt
          - Open the saved prompt for editing
          - Scroll through the long content
          - While the saved long prompt editor remains the underlying page, open Account > Layout details again and Refresh measurements. Read the actual Browser inner width and height (390 and 844), Document client width, Document scroll width and Horizontal overflow. Verify the real page has zero horizontal overflow and scroll width does not exceed client width; retain the numerical observation for the original mobile assertion. This is a nonmodal popover and must not change root/body overflow styles. Close Account before continuing.
          - In the editor Variables preview inputs, set topic to Mobile, verify the preview begins Mobile Mobile. and preserves all 24 numbered lines, then use Copy preview result. Open a disposable New Prompt draft and keyboard-paste into Body to compare the actual clipboard with the rendered text. Cancel that draft without saving.
          - assert: Verify the primary actions remain usable on mobile without horizontal overflow
          - assert: Verify one topic variable input exists and changes the live preview; verify the clipboard pasted into the disposable draft equals the entire 24-line template with {{topic}} replaced once by Mobile, including Chinese, emoji and line breaks. Verify original saved template and Launch default remain unchanged after reload.
