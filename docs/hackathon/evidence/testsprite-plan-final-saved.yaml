          - Fill in the description field with TS4 onboarding and save flow coverage
          - Fill in the body field with TS4 prompt body content for onboarding persistence
          - Save the prompt
          - Reload the page
          - assert: Verify the saved prompt appears in the library with the exact title, description, and body content preserved after reload
          - assert: Verify the prompt remains available in the same local workspace after reload
      - id: EDT-002
        priority: High
        name: Edit, duplicate, favorite, archive, and restore a prompt
