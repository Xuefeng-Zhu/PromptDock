# TestSprite test plan
#
# How to edit:
#   - Change a test case by editing its "name", "description", "priority" or "steps".
#   - Add a test case anywhere; leave out "id" (or use a new one).
#   - Move a test case by placing it under another use case.
#   - Add a use case with a new "useCase" block; "slug" is optional.
#   - Remove a test case or a whole use case by deleting it from this file.
#   - Steps: a plain line is an action, "assert: ..." checks the expected result.
#
# Save when you are done to apply your changes.

# ----------------------------------------------------------------------------

useCases:
  - useCase: Local Onboarding
    slug: ONB
    testCases:
      - id: ONB-001
        priority: High
        name: Start local onboarding and save a new prompt
        description: Verifies first-use local onboarding, creation of a prompt, canceling a draft, and persistence after reload.
        steps:
          - Navigate to the app on a fresh anonymous browser context
          - Start locally from the onboarding screen if it appears
          - Open the prompt creation flow
          - Fill the title field with TS4 Local Launch
          - Fill the description field with TS4 onboarding prompt for local storage
          - Fill the body field with TS4 launch body content for local persistence
          - Cancel the draft
          - Open the prompt creation flow again
          - Fill the title field with TS4 Local Launch
          - Fill the description field with TS4 onboarding prompt for local storage
          - Fill the body field with TS4 launch body content for local persistence
          - Save the prompt
          - Reload the page
          - assert: Verify the saved prompt is shown in the library with the exact stored title, description, and body after reload
      - id: ONB-002
        priority: High
        name: Edit, duplicate, favorite, archive, and restore a prompt
        description: Verifies editing, duplicating into the local workspace, favorite membership changes, archive/restore behavior, and visibility across active views.
        steps:
          - Navigate to PromptDock in a fresh anonymous browser context; choose Start locally if onboarding appears. Preserve all seed prompts.
          - Create one disposable prompt titled TS4 Lifecycle Source with body Disposable lifecycle body. Save and select it in All Prompts.
          - Open More options > Edit prompt. Change Title to TS4 Edited Prompt and Description to TS4 edited description. Save.
          - Select TS4 Edited Prompt and use More options > Duplicate. In the destination dialog choose My Prompts and click Duplicate. Verify Copy of TS4 Edited Prompt exists, then explicitly reselect the ORIGINAL exact title TS4 Edited Prompt for all following operations.
          - Mark the original TS4 Edited Prompt as favorite. Open Favorites and directly verify the original exact title and edited description are visible BEFORE archiving. Retain this observation.
          - Select that original in Favorites and use More options > Archive. Verify its exact title is now absent from Favorites.
          - BEFORE restoring anything, explicitly open All Prompts with empty header query and no folder/tag filters. Directly verify the original exact-title TS4 Edited Prompt is absent while Copy of TS4 Edited Prompt remains visible. This is the required active-library exclusion observation; do not defer it until after Restore.
          - Open Archived. Verify TS4 Edited Prompt with edited description is present. Select that exact original and use More options > Restore.
          - Explicitly return to All Prompts. Verify the original TS4 Edited Prompt and TS4 edited description are visible again; also verify the separate copy remains. Open Favorites and verify the restored original is present.
          - assert: Verify the edited prompt appears in Favorites before archiving and is excluded from the active library while archived, then returns after restore
      - id: ONB-003
        priority: High
        name: Create folders and tags, then search and sort prompts
        description: Verifies folder and tag assignment from the editor, filtered membership counts, tag removal, search recovery, and list or grid sorting behavior.
        steps:
          - Navigate to the app on a fresh anonymous browser context
          - Start locally from the onboarding screen if it appears
          - Open Add folders and create a folder named TS4 Folder Alpha in the library
          - Open the prompt editor for a new prompt
          - Fill the title field with TS4 Folder Tag Prompt
          - Fill the description field with TS4 folder and tag coverage
          - Fill the body field with Folder and tag regression body.
          - Assign the prompt to the folder TS4 Folder Alpha
          - Add a tag named TS4 Tag One
          - Add a second tag named TS4 Tag Two
          - Save the prompt
          - Open the folder view for TS4 Folder Alpha
          - Open the tag filter for TS4 Tag One
          - Remove the TS4 Tag Two tag from the prompt
          - Search for TS4 Folder Tag Prompt within the same library search field
          - Clear the SAME header library searchbox using real keyboard select-all and Backspace/Delete. Immediately verify its actual value is empty before selecting another scope; do not clear an independently queried palette instead.
          - Select All Prompts in the library
          - Switch between list and grid views
          - Change the sorting option
          - assert: Verify the prompt appears in the assigned folder and tag filters, the removed tag no longer appears, list and grid views both show the saved record, and the sort change keeps the library accessible without losing the record
          - assert: Verify clearing the same library search field restores all matches within the selected folder and tag scope, with the search field empty afterward
          - assert: Verify selecting All Prompts restores the full library and the saved record is visible again
      - id: ONB-004
        priority: Medium
        name: Use the command palette from the keyboard and search header
        description: Verifies the command palette opens from keyboard shortcuts or header search, supports navigation, selection, and escape to close.
        steps:
          - Navigate to the app on a fresh anonymous browser context
          - Start locally from the onboarding screen if it appears
          - Press Cmd or Ctrl plus K
          - Type a library search term into the command palette
          - Use the arrow keys to highlight a result
          - Press Enter to open the highlighted result
          - Press Escape to close the palette
          - Use the header search field to open search again if it opens the palette
          - Type a query with no matches
          - Press Escape to close the no-results state
          - assert: Verify the palette opens, a matching result can be selected with the keyboard, the no-results state is shown for an unmatched query, and Escape closes the palette
      - id: ONB-005
        priority: High
        name: Save and reload a template prompt with variable defaults and preview
        description: Verifies template metadata, default variable values, single-input behavior for repeated tokens, exact preview text, and copy behavior after reload.
        steps:
          - Navigate to the app on a fresh anonymous browser context
          - Start locally from the onboarding screen if it appears
          - Create a new prompt with the template title TS4 Template Prompt
          - "Set body exactly Write {{topic}} in {{tone}}. Repeat: {{topic}}. Configure topic as Text with saved Default value Launch; configure tone as Dropdown with options Friendly, Professional, Concise and saved Default value Friendly."
          - Save the prompt with topic defaulted to Launch and tone defaulted to Friendly
          - Reload the page
          - Open the saved prompt after reload and verify original metadata and saved defaults. Open Cmd/Ctrl+K, search TS4 Template Prompt and select it to open Fill Variables.
          - Fill the topic input with Launch Update
          - Select Professional in the tone dropdown
          - Copy the generated output
          - assert: "Verify there is one topic input for the repeated token and the modal preview is exactly Write Launch Update in Professional. Repeat: Launch Update. After Copy to Clipboard, open a disposable New Prompt draft and paste into Body with Cmd/Ctrl+V; assert exactly the same complete text, then Cancel without saving. A copy toast is insufficient."
      - id: ONB-006
        priority: High
        name: Render literal special characters in a template prompt
        description: Verifies literal rendering of special characters, HTML-like text, emoji, and braces in the editor, preview, inspector, fill modal, and clipboard.
        steps:
          - Navigate to the app on a fresh anonymous browser context
          - Start locally from the onboarding screen if it appears
          - Create a new prompt with the title TS4 Literal Prompt
          - "Set body exactly Write {{topic}} in {{tone}}. Repeat: {{topic}}. In Variables definitions set topic Default value exactly $& <tag> 中文 😀 {{tone}}; configure tone as Dropdown with options Friendly, Professional, Concise and Default value Professional. Verify editor Preview Result is exactly Write $& <tag> 中文 😀 {{tone}} in Professional. Repeat: $& <tag> 中文 😀 {{tone}}."
          - Save the prompt
          - "Open TS4 Literal Prompt and verify the inspector renders exactly Write $& <tag> 中文 😀 {{tone}} in Professional. Repeat: $& <tag> 中文 😀 {{tone}}."
          - Fill the topic input with $& <tag> 中文 😀 {{tone}}
          - Select Professional in the tone dropdown
          - "Open Ctrl+K (Cmd+K on macOS), search TS4 Literal Prompt, select the result to open Fill Variables. Verify the saved defaults and dropdown selection produce exactly Write $& <tag> 中文 😀 {{tone}} in Professional. Repeat: $& <tag> 中文 😀 {{tone}}."
          - Click Copy to Clipboard in Fill Variables. After it closes, open New Prompt, CLICK the Body textarea to focus it, and use native keyboard Cmd+V on macOS or Ctrl+V on Linux/Windows to paste once. Verify Body actually receives text; do not paste into Title or header search and do not substitute a toast for the clipboard value.
          - assert: "Verify the pasted body is exactly Write $& <tag> 中文 😀 {{tone}} in Professional. Repeat: $& <tag> 中文 😀 {{tone}}. Preserve every symbol, Chinese character, emoji and literal {{tone}} without recursive replacement or HTML interpretation. Do not rely on a copy toast. Cancel the verification draft without saving."
      - id: ONB-007
        priority: High
        name: Prevent constructor and proto placeholder regression
        description: Verifies the prompt remains stable with constructor and __proto__ placeholders, defaults are empty, save and reload work, and the generated output is exact.
        steps:
          - Navigate to the app on a fresh anonymous browser context
          - Start locally from the onboarding screen if it appears
          - Create a new prompt with the title TS4 Regression Prompt
          - Set body exactly Use {{constructor}} and {{__proto__}}. Keep both defaults empty, Save, then open Cmd/Ctrl+K and choose TS4 Regression Prompt to open Fill Variables.
          - In Fill Variables verify both variable inputs are initially empty.
          - In Fill Variables verify the rendered preview still shows exactly Use {{constructor}} and {{__proto__}}. before filling values, without inherited object values or a crash.
          - In Fill Variables verify Copy to Clipboard is disabled before required values are entered.
          - Cancel Fill Variables and verify the recipe is already saved in the library.
          - Reload the page
          - Open the saved recipe after reload and verify the unresolved body is still Use {{constructor}} and {{__proto__}}. Open Cmd/Ctrl+K and select TS4 Regression Prompt to open Fill Variables again.
          - Fill the constructor field with Ada
          - Fill the __proto__ field with literal
          - Verify the filled modal preview is exactly Use Ada and literal., then click Copy to Clipboard.
          - assert: Verify no crash occurred and the previously inspected preview is exactly Use Ada and literal. Open a disposable New Prompt draft, paste clipboard with Cmd/Ctrl+V into Body and assert the complete text is exactly Use Ada and literal. Cancel the verification draft without saving. Do not count a toast as clipboard evidence.
      - id: ONB-008
        priority: Medium
        name: Export active prompts and reimport without duplicates
        description: Verifies JSON export of active prompts, schema metadata, duplicate handling on reimport, overwrite of a modified disposable duplicate, and recovery after malformed imports.
        steps:
          - Open PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep the complete seeded library; use only disposable TS4 records in this case.
          - Create and save TS4 Fixture Recipe with Body exactly Fixture original {{name}}., Description Disposable test fixture, and tag ts4-fixture. This is the disposable duplicate baseline; do not modify any seeded recipe. Record its complete saved body, description, tags and variable metadata.
          - Create and save a separate active recipe titled TS4 Export Metadata with Body exactly Write {{topic}} in {{tone}}., Description Exact export metadata, and tag ts4-export. In Variables definitions set topic to Textarea with saved Default value Launch newline Campaign (a real newline), and tone to Dropdown with options Friendly, Professional and saved Default value Friendly. Verify the saved controls before continuing.
          - Create and save a disposable plain recipe titled TS4 Archived File Check with Body exactly Archived export exclusion. Archive this recipe through its prompt actions. Verify it appears in Archived and is excluded from All Prompts before opening Settings.
          - Open Settings > Import/Export and verify the persistent visible input labelled Choose JSON file is present. Do not select any file yet. For each later import step, use the runner upload operation on this input with only that step’s explicitly named attachment or actual downloaded backup. Do not use the editor From JSON textarea, invent a file path, or substitute another fixture. If this control is absent, report that the new application build is not deployed and stop.
          - Begin capturing the browser download, then click Export prompts to JSON file. Obtain the actual downloaded promptdock-export-YYYY-MM-DD.json file, using its real returned download path. Parse and retain its complete JSON document. A toast, screenshot, filename alone or assumed bytes is not export proof. If the runner cannot capture/read the download, report that capability blocker rather than claiming success.
          - "Inspect the actual downloaded JSON: version must be 1.0, exportedAt must be present, and prompts must contain every active baseline record with exact body, description, tags and variable metadata. Verify TS4 Archived File Check is absent, and record the full active prompt count/content before importing."
          - Select the actual exported JSON download in the persistent Choose JSON file input. Choose Skip duplicates. Select that SAME unmodified downloaded file again and choose Skip duplicates again. Verify no active recipe, body, tag or variable metadata changed and no duplicate copies were created after either import. Keep using actual downloaded bytes, not a reconstructed JSON string.
          - Select the attached Test File ts4-modified.json through Choose JSON file, using its actual available attachment path. Verify its incoming records are the modified TS4 Fixture Recipe and TS4 Imported New, then choose Overwrite duplicates. The disposable recipe must become Body Fixture updated {{name}}., Description Modified disposable fixture, tags ts4-fixture and updated. The one new recipe must have Body New unique fixture body. Do not overwrite any seeded recipe; do not substitute ts4-long.json. If the named attachment is unavailable, report its missing filename and stop.
          - Return to All Prompts, reload the page and inspect the saved disposable records. Verify their full bodies, descriptions, tags and variable metadata match the expected imported versions and each title appears exactly once. Preserve the complete seeded baseline.
          - Open Settings > Import/Export and verify the persistent visible input labelled Choose JSON file is present. Do not select any file yet. For each later import step, use the runner upload operation on this input with only that step’s explicitly named attachment or actual downloaded backup. Do not use the editor From JSON textarea, invent a file path, or substitute another fixture. If this control is absent, report that the new application build is not deployed and stop.
          - Record the complete saved library baseline. Select actual attached ts4-bad-json.json through Choose JSON file and verify the import error and no persisted changes before proceeding. Then select actual attached ts4-bad-schema.json and verify schema rejection and no persisted changes. Keep both files unchanged; do not approximate malformed data in a different UI. Missing required attachments remain blockers.
          - Select actual attached ts4-valid.json through Choose JSON file, using the runner-reported attachment path. This file contains TS4 Fixture Recipe with Body Fixture original {{name}}., Description Disposable test fixture and tag ts4-fixture. Complete the import, choosing Skip duplicates if unchanged records already exist. Verify success and the exact imported values. An unavailable named attachment remains a blocker.
          - Return to All Prompts, reload the page and inspect the saved disposable records. Verify their full bodies, descriptions, tags and variable metadata match the expected imported versions and each title appears exactly once. Preserve the complete seeded baseline.
          - assert: Verify the active library excludes archive content from export, duplicate prompts are not multiplied, the overwritten disposable prompt does not create an extra record, the new record persists after reload, and malformed or invalid JSON shows an import error without partial mutations
      - id: ONB-009
        priority: Medium
        name: Handle long prompt content, search empty states, and favorites or archive recovery
        description: Verifies long multiline content round-trips exactly, unsupported placeholder names remain literal, and empty-state recovery for search, favorites, and archived views.
        steps:
          - Navigate to PromptDock in a fresh anonymous browser context and choose Start locally if onboarding appears. Keep all seeded recipes; this case uses only one disposable recipe.
          - Open New Prompt once and set Title to TS4 Long ONB009.
          - Use the visible Load text file input to upload the actual attached ts4-exact-12k.txt. Preserve its complete UTF-8 text, including literal {{bad-name!}}. Do not use From JSON, copy a truncated preview, type a sample or regenerate the fixture.
          - Click Text details in the editor. Wait for the locally computed Text SHA-256 and UTF-8 bytes outputs. Read the actual full 64-character digest and compare with 23e14e2b4353242e11ada37a7f645db7d74437b015efdf598179cb0ce70cff7a; bytes must be 12288. This is a fingerprint of ALL current text, independently compared with the source-file digest, not a screenshot/length/toast comparison. Treat any different digest as failure, not a pass. If Text details is absent, report the undeployed-build blocker. Keep the Body unchanged.
          - Save the recipe.
          - Reload the actual browser page. This must restore the saved recipe from persistence; navigating to Library alone does not perform a reload.
          - In All Prompts select TS4 Long ONB009, open More options > Edit prompt, and click Text details. Read the ACTUAL computed full Text SHA-256 after reload. Compare all 64 hex characters with 23e14e2b4353242e11ada37a7f645db7d74437b015efdf598179cb0ce70cff7a; UTF-8 bytes must be 12288. This verifies the complete restored Body against the independently calculated expected source digest. Also verify the literal unsupported {{bad-name!}} text remains present. A copied expected constant, visible excerpt or approximate character count cannot satisfy this comparison. Retain this exact-comparison evidence for the assertion below. To cancel this unchanged saved edit, use the Library breadcrumb; the saved Edit Prompt screen has no separate Cancel button. Do not click Save.
          - Leave the unchanged editor through the Library breadcrumb without saving (cancel the edit). Return to All Prompts and record the complete baseline titles/count including the long recipe.
          - Focus the HEADER LIBRARY searchbox with keyboard Tab. Enter TS4 unmatched 918274 into that same searchbox, verify its actual query and the No prompts found library state. Do not click an empty header searchbox or operate the independent command palette.
          - Clear the SAME header library searchbox using actual keyboard Select All and Backspace/Delete. Verify its value is empty and the complete baseline library returns.
          - Open Favorites in sidebar navigation and verify the empty Favorites state with the header query still empty.
          - Open Archived in sidebar navigation and verify the empty Archived state with the header query still empty.
          - Explicitly select All Prompts with header query empty and no tag/folder filters. Verify every recorded baseline title/count and the saved long recipe return. Retain the full computed post-reload fingerprint comparison evidence above.
          - assert: Compare the entire saved Body after reload with the attached ts4-exact-12k.txt exactly, including unsupported {{bad-name!}} remaining literal. Verify all empty search, Favorites and Archived states can be exited back to the full baseline library and saved recipe. An excerpt or toast is insufficient.
      - id: ONB-010
        priority: Medium
        name: Use the mobile layout to create and execute a prompt
        description: Verifies the mobile viewport shows the drawer and settings flow, supports creating and editing prompts, allows scrolling through long content, and keeps primary actions accessible without horizontal overflow.
        steps:
          - Navigate to the app on a fresh anonymous browser context at a mobile viewport
          - Verify the viewport width matches a mobile layout
          - Start locally from the onboarding screen if it appears
          - Open the navigation drawer
          - Open Settings from the drawer
          - Go back from Settings
          - Dismiss the drawer with Escape
          - Create a new prompt with the title TS4 Mobile Prompt
          - Fill a long prompt body that requires scrolling to review
          - Save the prompt
          - Open the saved prompt
          - Fill a value into the prompt variables
          - Copy the generated output
          - Dismiss any helper or preview overlay if present
          - assert: Verify primary actions remain accessible on mobile, the prompt content can be scrolled and edited, and there is no horizontal overflow that blocks use of the app
  - useCase: Prompt Library Browsing
    slug: LIB
    testCases:
      - id: LIB-001
        priority: High
        name: Browse seeded library views
        description: Validate the seeded prompt library is available after local onboarding and each core library view shows the expected prompt set.
        steps:
          - Navigate to the PromptDock app in a fresh browser context
          - Choose local onboarding to start using the app locally
          - Wait for the main library to load
          - Open the Favorites view
          - Open the Recent view
          - Open the Archived view
          - Return to the All Prompts view
          - assert: Verify the seeded prompt library is displayed in the main view with prompt cards present
          - assert: Verify the Favorites, Recent, and Archived views each display their expected empty-or-populated library state
      - id: LIB-002
        priority: High
        name: Create a prompt and persist it after reload
        description: Validate that a new prompt can be created with title, description, and body, then saved and restored exactly after reload.
        steps:
          - Navigate to the PromptDock app in a fresh browser context
          - Choose local onboarding to start using the app locally
          - Start creating a new prompt
          - Fill in a unique TS4-prefixed title
          - Fill in a unique TS4-prefixed description
          - Fill in a unique TS4-prefixed prompt body
          - Save the prompt
          - Reload the page
          - Open the saved prompt from the library
          - assert: Verify the saved prompt is present in the library after reload
          - assert: Verify the title, description, and body are restored exactly as saved
      - id: LIB-003
        priority: Medium
        name: Cancel a draft and keep the library unchanged
        description: Validate that canceling a prompt draft discards the unsaved draft and leaves the library unchanged.
        steps:
          - Navigate to the PromptDock app in a fresh browser context
          - Choose local onboarding to start using the app locally
          - Start creating a new prompt
          - Fill in a unique TS4-prefixed title
          - Fill in a unique TS4-prefixed description
          - Fill in a unique TS4-prefixed prompt body
          - Cancel the draft
          - Return to the main library view
          - assert: Verify the unsaved draft does not appear as a saved prompt
          - assert: Verify the main library remains unchanged after canceling the draft
      - id: LIB-004
        priority: High
        name: Edit, duplicate, favorite, archive, and restore a prompt
        description: Validate the core prompt management actions work end to end and update library membership correctly.
        steps:
          - Navigate to the PromptDock app in a fresh browser context
          - Choose local onboarding to start using the app locally
          - Create and save a unique TS4-prefixed prompt
          - Open the prompt for editing
          - Update the prompt title and body
          - Save the edited prompt
          - Duplicate the prompt into the local workspace if a destination dialog appears
          - Mark the prompt as a favorite
          - Archive the prompt
          - Open the Favorites view
          - Open the Archived view
          - Restore the archived prompt
          - Open the All Prompts view
          - assert: Verify the edited prompt, its duplicate, and the archive state are reflected in the library views
          - assert: Verify the prompt appears in Favorites when favorited, is excluded from active views when archived, and returns after restore
      - id: LIB-005
        priority: High
        name: Create folders and tags, then filter and search prompts
        description: Validate folder and tag assignment from the editor and confirm list filtering, counts, and search recovery work correctly.
        steps:
          - Navigate to the PromptDock app in a fresh browser context
          - Choose local onboarding to start using the app locally
          - Create and save a unique TS4-prefixed prompt
          - Open the saved prompt for editing
          - Assign the prompt to a new folder
          - Add one or more tags through the editor
          - Save the prompt
          - Open the folder view for the assigned folder
          - Open the tag filter for one of the assigned tags
          - Search for the prompt using its title
          - Focus the SAME header library searchbox that contains the title query. Send real keyboard Select All (Control+A, or Meta+A on macOS) then Backspace. Do not substitute an empty fill or a DOM value assignment. Verify the query is empty and all matches in the selected tag/folder scope return. Then explicitly select sidebar All Prompts and verify full-library recovery; clearing a query alone does not reset tag/folder selection.
          - assert: Verify the prompt appears in the assigned folder and tag-filtered views with matching membership counts
          - assert: Verify search returned the saved recipe, clearing the query restored all matches in its selected scope, and explicitly selecting All Prompts restored the full broader library with the saved recipe still present.
      - id: LIB-006
        priority: Medium
        name: Switch between list and grid views and sort prompts
        description: Validate the library can switch layouts and preserve prompt visibility while sorting changes the ordering of the list.
        steps:
          - Navigate to the PromptDock app in a fresh browser context
          - Choose local onboarding to start using the app locally
          - Open the All Prompts view
          - Switch to grid view
          - Switch back to list view
          - Change the sort order
          - Open a prompt from the sorted list
          - assert: Verify prompts remain visible when switching between list and grid views
          - assert: Verify the list order updates according to the selected sort mode
      - id: LIB-007
        priority: High
        name: Search the library with the command palette
        description: Validate the command palette supports prompt search, keyboard navigation, selection, and dismissal.
        steps:
          - Navigate to the PromptDock app in a fresh browser context
          - Choose local onboarding to start using the app locally
          - Open the command palette from the header search or keyboard shortcut
          - Search for a known prompt title
          - Use the arrow keys to highlight a matching result
          - Press Enter to open the highlighted result
          - Open the command palette again
          - Search for a term with no matches
          - Press Escape to dismiss the palette
          - assert: Verify the matching prompt opens from the palette
          - assert: Verify the palette shows a no-results state for an unmatched query and closes on Escape
      - id: LIB-008
        priority: Medium
        name: Use the command palette from header search
        description: Validate the header search can open the command palette and support keyboard selection of a result.
        steps:
          - Navigate to the PromptDock app in a fresh browser context
          - Choose local onboarding to start using the app locally
          - Ensure the header library query is empty. CLICK the empty header search field and immediately verify the Command palette DIALOG opens. Operate the search textbox INSIDE that dialog, not the background header input. If it does not open, this header-trigger assertion must fail; do not substitute another trigger to pass it.
          - Inside the Command palette dialog search Email Draft, a seeded VARIABLE recipe. Verify the matching result is shown in the dialog before using keyboard selection.
          - Use the arrow keys to move between results
          - With the palette dialog active, press Enter on Email Draft to open Fill Variables. A plain recipe would execute Copy; this variable fixture must open the modal.
          - assert: Verify the empty header-search click opened Command palette and its keyboard-selected Email Draft result opened Fill Variables.
          - assert: Verify keyboard selection changes the active result before opening it
      - id: LIB-009
        priority: High
        name: Save a template prompt and restore it after reload
        description: Validate template prompts preserve variable metadata, preview output, and saved content exactly after reload.
        steps:
          - Navigate to the PromptDock app in a fresh browser context
          - Choose local onboarding to start using the app locally
          - Create a prompt with the template body using topic and tone variables
          - Set the default topic to Launch
          - Set the tone dropdown default to Friendly
          - Save the template prompt
          - Reload the page
          - Open the saved template prompt
          - assert: Verify the saved template metadata and variable defaults are restored after reload
          - assert: Verify the live preview and prompt body reflect the template exactly with a single topic input despite the repeated token
      - id: LIB-010
        priority: High
        name: Use literal variable-like text without recursive replacement
        description: Validate literal placeholder-like content renders exactly and does not get interpreted as HTML or recursive variables.
        steps:
          - Navigate to the PromptDock app in a fresh browser context
          - Choose local onboarding to start using the app locally
          - "Create a prompt titled TS4 Library Literal with body exactly Write {{topic}} in {{tone}}. Repeat: {{topic}}. Keep the unresolved placeholders in the saved template."
          - In Variables definitions configure tone as Dropdown with options Friendly, Professional, Concise and Default value Professional.
          - "In Variables definitions set topic Default value exactly $& <tag> 中文 😀 {{tone}}. Verify editor Preview Result exactly equals Write $& <tag> 中文 😀 {{tone}} in Professional. Repeat: $& <tag> 中文 😀 {{tone}}."
          - Save the prompt
          - "Select TS4 Library Literal and verify the inspector body exactly equals Write $& <tag> 中文 😀 {{tone}} in Professional. Repeat: $& <tag> 中文 😀 {{tone}}. Then open Ctrl+K (Cmd+K on macOS), search TS4 Library Literal and select the result to open Fill Variables. Verify the modal preview matches exactly."
          - Click Copy to Clipboard in the modal. Open a new prompt draft and paste with Ctrl+V (Cmd+V on macOS) into its body to expose actual clipboard content.
          - assert: "Verify the pasted body exactly equals Write $& <tag> 中文 😀 {{tone}} in Professional. Repeat: $& <tag> 中文 😀 {{tone}}. A copy toast alone cannot establish equality."
          - assert: Verify the literal $&, <tag>, Chinese, emoji and {{tone}} are preserved without HTML interpretation or recursive substitution. Cancel the verification draft without saving.
      - id: LIB-011
        priority: High
        name: Handle constructor and proto variable names safely
        description: Validate prompts containing constructor and proto variable names save, reload, and render without crashes or unsafe placeholder expansion.
        steps:
          - Navigate to the PromptDock app in a fresh browser context
          - Choose local onboarding to start using the app locally
          - Create a recipe titled TS4 Safe LIB011 with body exactly Use {{constructor}} and {{__proto__}}. Keep both defaults empty, Save, then Cmd/Ctrl+K and select this recipe to open Fill Variables.
          - In Fill Variables verify both inputs are initially empty and the preview is exactly Use {{constructor}} and {{__proto__}}., with no inherited object value or crash.
          - In Fill Variables verify Copy to Clipboard is disabled while either required value is empty. Do not perform this validation on inspector Copy, which permits unresolved template text.
          - Cancel Fill Variables. Verify the recipe was saved with its unresolved body and empty defaults; do not fill execution values before this initial persistence check.
          - Reload the page
          - After reload, Cmd/Ctrl+K and select TS4 Safe LIB011 to reopen Fill Variables. Fill constructor with Ada.
          - In Fill Variables fill __proto__ with literal; verify the preview becomes exactly Use Ada and literal.
