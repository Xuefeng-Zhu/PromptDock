      - id: FLT-010
        priority: Medium
        name: Use the command palette with a no-results query and recover
        description: Validates that the command palette shows an empty state for unknown queries and can be dismissed cleanly.
        steps:
          - Navigate to the app and choose local onboarding if it appears.
          - Open the command palette from the header shortcut.
